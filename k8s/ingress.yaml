apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lantern-table
  namespace: lantern-table
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  rules:
    - host: dnd.waylonwalker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lantern-table
                port:
                  number: 8765
  tls:
    - hosts:
        - dnd.waylonwalker.com
      secretName: dnd-waylonwalker-com-tls

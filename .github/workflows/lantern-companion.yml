name: Lantern companion Go CLI
on:
  pull_request:
    paths:
      - 'companion/**'
      - 'scripts/install-lantern.sh'
      - '.github/workflows/lantern-companion.yml'
      - 'dnd_chatgpt_server.py'
      - 'assets/app.js'
  push:
    tags: ['lantern-v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify CLI build and tests
        working-directory: companion
        run: |
          go mod tidy
          go test ./...
          go vet ./...
          go build ./...
      - name: Validate python + web client
        run: |
          python -m py_compile dnd_chatgpt_server.py
          node --check assets/app.js
          sh -n scripts/install-lantern.sh
  package:
    if: startsWith(github.ref, 'refs/tags/lantern-v')
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: astral-sh/setup-uv@v6
      - name: Create self-contained CLI and uv runtime bundle
        shell: bash
        env:
          TARGET: lantern-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd companion
          go mod tidy
          go build -trimpath -ldflags "-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o ../stage/lantern .
          cd ..
          mkdir -p stage/bridge dist
          cp dnd_chatgpt_server.py dnd_localfirst_demo.html service-worker.js manifest.webmanifest stage/bridge/
          cp -R assets stage/bridge/
          cp "$(command -v uv)" stage/bridge/uv
          tar -czf "dist/${TARGET}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/lantern-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lantern-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum lantern-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true